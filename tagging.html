[_0x4cc8c7(0x374)]=function(){var _0x5eaf3a=_0x4cc8c7,_0x38f215=_0x42419a(_0x5eaf3a(0x96e));_0x38f215[_0x5eaf3a(0xb8e)][_0x5eaf3a(0x505)](_0x5eaf3a(0x50d)),_0x38f215[_0x5eaf3a(0x4f3)]=_0x5eaf3a(0x30f)+(void 0x0!==_0x26e946&&_0x26e946?'Perugia\x20Basket':_0x5eaf3a(0xb3f))+'.</p>\x0a<h3>Partite</h3>\x0a<p>In\x20Partite\x20scegli\x20la\x20serie\x20(C\x20o\x20B)\x20e\x20trovi\x20l\x27elenco\x20delle\x20partite\x20taggate,\x20con\x20chi\x20ci\x20ha\x20lavorato\x20e\x20quando.\x20Con\x20Nuova\x20partita\x20scegli\x20la\x20serie\x20(B\x20o\x20C;\x20per\x20gli\x20Under\x20la\x20partita\x20si\x20carica\x20dall\x27elenco\x20del\x20gruppo,\x20vedi\x20Tagging\x20Under),\x20la\x20Squadra\x20A\x20e\x20la\x20Squadra\x20B\x20(la\x20prima\x20è\x20quella\x20di\x20casa),\x20la\x20giornata\x20e\x20la\x20data.\x20Se\x20la\x20partita\x20è\x20nel\x20calendario,\x20giornata\x20e\x20data\x20si\x20compilano\x20da\x20sole.\x20Il\x20titolo\x20si\x20scrive\x20in\x20automatico\x20e\x20lo\x20puoi\x20correggere.\x20Modifica\x20partita\x20apre\x20la\x20stessa\x20finestra,\x20già\x20compilata.</p>\x0a<p>Elimina\x20sposta\x20la\x20partita\x20nel\x20Cestino,\x20dopo\x20una\x20conferma:\x20resta\x2014\x20giorni\x20e\x20puoi\x20ripristinarla.\x20Passati\x20i\x2014\x20giorni\x20viene\x20cancellata\x20per\x20sempre,\x20insieme\x20ai\x20suoi\x20tag.\x20Con\x20Elimina\x20ora\x20la\x20cancelli\x20subito.</p>\x0a<h3>Il\x20video</h3>\x0a<p>Scegli\x20video\x20propone\x20le\x20partite\x20già\x20caricate\x20su\x20Drive\x20e\x20ti\x20lascia\x20aprire\x20un\x20file\x20mp4\x20dal\x20tuo\x20computer,\x20incollare\x20il\x20link\x20di\x20YouTube\x20o\x20Facebook,\x20oppure\x20caricare\x20un\x20video\x20nuovo\x20dall\x27app:\x20va\x20su\x20Drive\x20e\x20anche\x20nella\x20playlist\x20YouTube.\x20Se\x20il\x20browser\x20lo\x20permette,\x20ricorda\x20l\x27ultimo\x20file\x20di\x20ogni\x20partita\x20e\x20basta\x20premere\x20Riapri\x20l\x27ultimo.\x20Finestra\x20porta\x20il\x20video\x20fuori\x20dalla\x20pagina,\x20in\x20una\x20finestra\x20che\x20puoi\x20ingrandire,\x20rimpicciolire\x20e\x20spostare\x20anche\x20su\x20un\x20altro\x20schermo.\x20I\x20pulsanti\x20con\x20il\x20meno\x20e\x20il\x20più\x20cambiano\x20la\x20grandezza\x20del\x20video\x20nella\x20pagina.\x20Puoi\x20anche\x20taggare\x20una\x20diretta\x20da\x20YouTube\x20o\x20Facebook,\x20indicando\x20le\x20due\x20squadre\x20e\x20la\x20giornata.</p>\x0a<h3>Tagliare\x20una\x20clip</h3>\x0a<p>Durante\x20il\x20video\x20premi\x20un\x20pulsante\x20di\x20categoria,\x20oppure\x20il\x20tasto\x20che\x20gli\x20è\x20stato\x20assegnato.\x20Ogni\x20pulsante\x20(categorie,\x20descrittori\x20e\x20giocatori)\x20ha\x20una\x20scorciatoia\x20automatica,\x20che\x20puoi\x20cambiare\x20nelle\x20sue\x20impostazioni.\x20Per\x20i\x20nostri\x20giocatori\x20la\x20scorciatoia\x20è\x20il\x20numero\x20di\x20maglia:\x20digiti\x207,\x20oppure\x201\x20e\x200\x20di\x20seguito\x20per\x20il\x2010.\x20I\x20numeri\x20sono\x20riservati\x20alle\x20maglie,\x20i\x20pulsanti\x20usano\x20le\x20lettere.</p>\x0a<p>L\x27icona\x20con\x20la\x20freccia\x20Maiusc,\x20nella\x20riga\x20dei\x20pulsanti,\x20mostra\x20il\x20tasto\x20tra\x20parentesi\x20vicino\x20al\x20nome\x20di\x20ogni\x20pulsante:\x20toccala\x20per\x20tenerli\x20visibili,\x20oppure\x20tieni\x20premuto\x20Maiusc\x20per\x20vederli\x20solo\x20finché\x20lo\x20premi.</p>\x0a<p>Il\x20tag\x20si\x20crea\x20al\x20minuto\x20in\x20cui\x20sei,\x20con\x20i\x20secondi\x20prima\x20e\x20dopo\x20decisi\x20per\x20quel\x20pulsante.\x20Subito\x20dopo,\x20con\x20il\x20tag\x20selezionato,\x20premi\x20i\x20descrittori\x20e\x20i\x20giocatori\x20da\x20collegare.\x20Un\x20descrittore\x20o\x20un\x20giocatore\x20premuto\x20una\x20seconda\x20volta\x20si\x20toglie.\x20Dal\x20tag\x20selezionato\x20puoi\x20riguardare\x20la\x20clip,\x20allungarla\x20o\x20accorciarla,\x20scrivere\x20una\x20nota\x20o\x20eliminarla.</p>\x0a<h3>Due\x20tipi\x20di\x20pulsante</h3>\x0a<p>La\x20categoria\x20crea\x20un\x20tag\x20nuovo,\x20per\x20esempio\x202PT\x20o\x20Palla\x20persa.\x20Il\x20descrittore\x20si\x20aggiunge\x20al\x20tag\x20selezionato,\x20per\x20esempio\x20Ottimo,\x20Buono\x20o\x20Negativo.\x20I\x20giocatori\x20sono\x20descrittori:\x20quando\x20ne\x20premi\x20uno,\x20la\x20clip\x20entra\x20tra\x20quelle\x20di\x20quel\x20giocatore\x20e\x20la\x20vedi\x20nella\x20sua\x20scheda\x20dentro\x20l\x27app\x20(la\x20vedono\x20staff\x20e\x20ospiti).\x20I\x20giocatori\x20di\x20Perugia\x20sono\x20bianchi\x20se\x20si\x20gioca\x20in\x20casa\x20e\x20blu\x20in\x20trasferta,\x20quelli\x20dell\x27altra\x20squadra\x20sono\x20gialli.</p>\x0a<p>Ogni\x20pulsante\x20premuto\x20fa\x20un\x20breve\x20lampo\x20di\x20luce,\x20anche\x20quando\x20viene\x20premuto\x20in\x20automatico\x20da\x20un\x20collegamento.</p>\x0a<h3>Pulsanti\x20automatici\x20ed\x20esiti</h3>\x0a<p>Alcuni\x20pulsanti\x20ne\x20premono\x20altri\x20da\x20soli.\x201c1\x20preme\x20anche\x201c1\x20difesa\x20per\x20l\x27avversario\x20e\x20ti\x20chiede\x20se\x20vuoi\x20dare\x20un\x20descrittore\x20anche\x20alla\x20difesa.\x20Rimbalzo\x20attacco\x20preme\x20Tag\x20Up\x20(Ottimo)\x20per\x20la\x20stessa\x20squadra\x20e\x20Tagliafuori\x20(Negativo)\x20per\x20l\x27avversaria.\x20P&R\x20Handler\x20preme\x20anche\x201c1,\x20con\x20lo\x20stesso\x20descrittore,\x20e\x201c1\x20difesa.\x20Post\x20basso\x20preme\x20Post\x20basso\x20difesa.\x20Le\x20coppie\x20attacco\x20e\x20difesa\x20(contenimento\x20e\x20drop,\x20in\x20terza,\x20lo\x20show,\x20cucù,\x20il\x20cambio,\x20fondo)\x20si\x20premono\x20a\x20vicenda\x20per\x20l\x27avversario:\x20se\x20uno\x20riceve\x20Ottimo,\x20l\x27altro\x20diventa\x20Negativo,\x20e\x20il\x20contrario.\x20Il\x20Buono\x20non\x20viene\x20copiato.</p>\x0a<p>L\x27esito\x20(Ottimo,\x20Buono,\x20Negativo)\x20è\x20uno\x20solo\x20per\x20ogni\x20schema\x20o\x20P&R:\x20se\x20ne\x20ha\x20già\x20uno\x20non\x20ne\x20riceve\x20un\x20altro.\x20Gli\x20schemi\x20(Gioco\x201-8,\x20rimesse,\x20zone)\x20possono\x20prenderlo\x20da\x20soli:\x20nelle\x20impostazioni\x20dello\x20schema\x20scegli\x20le\x20regole,\x20per\x20esempio\x20se\x20entro\x2020\x20secondi\x20premi\x202PT\x20lo\x20schema\x20diventa\x20Ottimo,\x20se\x20premi\x202PT\x20Sbagliato\x20diventa\x20Negativo.</p>\x0a<p>Il\x20fallo\x20va\x20in\x20automatico\x20alla\x20squadra\x20in\x20difesa,\x20a\x20meno\x20che\x20tu\x20non\x20selezioni\x20un\x20giocatore\x20in\x20attacco:\x20a\x20quel\x20punto\x20passa\x20all\x27attacco.\x20Nelle\x20impostazioni\x20di\x20ogni\x20pulsante\x20c\x27è\x20la\x20sezione\x20Collegamenti\x20automatici,\x20dove\x20crei\x20i\x20tuoi:\x20scegli\x20il\x20pulsante\x20da\x20premere,\x20la\x20squadra\x20e\x20il\x20descrittore,\x20che\x20può\x20essere\x20copiato,\x20specchiato\x20(Ottimo\x20diventa\x20Negativo)\x20o\x20chiesto\x20ogni\x20volta.</p>\x0a<h3>Modificare\x20la\x20tua\x20finestra</h3>\x0a<p>Modifica\x20ti\x20permette\x20di\x20sistemare\x20tutti\x20i\x20pulsanti\x20dove\x20vuoi:\x20li\x20trascini\x20con\x20il\x20dito\x20o\x20con\x20il\x20mouse\x20e\x20li\x20ridimensioni\x20con\x20la\x20maniglia\x20in\x20basso\x20a\x20destra.\x20Per\x20spostarne\x20più\x20di\x20uno\x20insieme,\x20trascina\x20con\x20la\x20freccia\x20sullo\x20sfondo\x20per\x20fare\x20un\x20rettangolo\x20di\x20selezione\x20(con\x20Maiusc\x20aggiungi\x20o\x20togli\x20un\x20pulsante\x20dalla\x20selezione)\x20e\x20poi\x20trascina\x20uno\x20dei\x20selezionati.</p>\x0a<p>Toccando\x20un\x20pulsante\x20apri\x20le\x20sue\x20impostazioni:\x20nome,\x20comportamento\x20(categoria\x20o\x20descrittore),\x20forma,\x20grandezza,\x20colore,\x20tasto,\x20secondi\x20di\x20clip\x20prima\x20e\x20dopo,\x20gruppo\x20(Schema,\x20Difesa\x20o\x20nessuno),\x20regole\x20di\x20esito\x20e\x20collegamenti\x20automatici.\x20Un\x20pulsante\x20del\x20gruppo\x20Difesa\x20crea\x20il\x20tag\x20per\x20la\x20squadra\x20della\x20tabella\x20non\x20selezionata.\x20Nello\x20stesso\x20gruppo\x20di\x20descrittori\x20se\x20ne\x20sceglie\x20uno\x20solo.\x20Duplica\x20copia\x20un\x20pulsante,\x20la\x20x\x20lo\x20elimina\x20o\x20toglie\x20un\x20giocatore\x20dalla\x20partita,\x20+\x20Pulsante\x20ne\x20aggiunge\x20uno\x20nuovo.\x20Fine\x20salva\x20tutto,\x20Annulla\x20torna\x20com\x27era.\x20Sullo\x20sfondo\x20c\x27è\x20un\x20campo\x20da\x20basket,\x20solo\x20per\x20orientarti.</p>\x0a<h3>Una\x20tabella\x20per\x20squadra</h3>\x0a<p>Il\x20pulsante\x20con\x20il\x20nome\x20della\x20squadra\x20e\x20Tab\x20passa\x20alla\x20tabella\x20e\x20ai\x20giocatori\x20dell\x27altra\x20squadra\x20(scorciatoia:\x20il\x20tasto\x20Tab,\x20o\x20il\x20tasto\x20<\x20vicino\x20a\x20Maiusc).\x20L\x27ultima\x20tabella\x20salvata\x20è\x20quella\x20ufficiale:\x20tutte\x20le\x20squadre\x20usano\x20gli\x20stessi\x20pulsanti\x20nelle\x20stesse\x20posizioni,\x20cambiano\x20solo\x20i\x20giocatori.\x20Se\x20la\x20modifichi,\x20la\x20nuova\x20disposizione\x20diventa\x20quella\x20di\x20tutte.</p>\x0a<p>Ogni\x20volta\x20che\x20passi\x20da\x20una\x20squadra\x20all\x27altra,\x20con\x20Tab\x20o\x20con\x20il\x20pulsante\x20sullo\x20schermo\x20(quindi\x20anche\x20su\x20iPad),\x20il\x20possesso\x20viene\x20contato\x20alla\x20squadra\x20di\x20cui\x20apri\x20la\x20tabella.\x20Con\x20le\x20coppie\x20attacco\x20e\x20difesa\x20(contenimento\x20e\x20drop,\x20in\x20terza,\x20show,\x20cucù,\x20cambio,\x20fondo)\x20ti\x20chiede\x20prima\x20l\x27avversario,\x20poi\x20scegli\x20il\x20giocatore\x20della\x20squadra\x20in\x20tab.\x20Le\x20domande\x20restano\x20sullo\x20schermo\x203\x20secondi.\x20Il\x20+\x20accanto\x20ai\x20descrittori\x20di\x20un\x20tag\x20serve\x20ad\x20aggiungere\x20una\x20descrizione\x20dimenticata.\x20Quando\x20premi\x20Fallo\x20ti\x20chiede\x20se\x20segnare\x20il\x20giocatore\x20in\x20difesa.\x20Quando\x20premi\x20un\x20P&R,\x20in\x20attacco\x20o\x20in\x20difesa,\x20ti\x20chiede\x20il\x20difensore,\x20e\x20l\x27attaccante\x20che\x20tocchi\x20dopo\x20si\x20lega\x20allo\x20stesso\x20P&R.\x20L\x27elenco\x20dei\x20tag\x20ha\x20in\x20cima\x20il\x20più\x20recente.\x20Il\x20pulsante\x20Rimbalzo\x20avv.\x20dà\x20il\x20rimbalzo\x20alla\x20squadra\x20che\x20difende,\x20ti\x20chiede\x20se\x20attribuirlo\x20a\x20un\x20giocatore\x20e\x20passa\x20alla\x20sua\x20tabella.\x20Il\x20cambio\x20avviene\x20da\x20solo\x20dopo\x20un\x20rimbalzo\x20in\x20difesa,\x20dopo\x20una\x20palla\x20persa\x20e\x20dopo\x20un\x20tiro\x20da\x202\x20o\x203\x20segnato,\x20appena\x20scegli\x20il\x20giocatore:\x20se\x20poi\x20il\x20tiro\x20risulta\x20sbagliato,\x20la\x20tabella\x20e\x20il\x20possesso\x20tornano\x20com\x27erano.\x20Maiusc\x20resta\x20per\x20aggiungere\x20un\x20possesso\x20a\x20mano\x20e\x20non\x20si\x20somma\x20se\x20l\x27hai\x20appena\x20contato.</p>\x0a<p>Sotto\x20i\x20pulsanti,\x20il\x20tasto\x20con\x20il\x20nome\x20della\x20squadra\x20serve\x20ad\x20aggiungere\x20giocatori:\x20vedi\x20quelli\x20non\x20selezionati\x20e\x20puoi\x20inserirne\x20uno\x20che\x20non\x20è\x20nel\x20database.\x20Se\x20un\x20giocatore\x20cambia\x20numero\x20di\x20maglia\x20nelle\x20statistiche\x20FIP\x20Stats,\x20il\x20numero\x20si\x20aggiorna\x20da\x20solo\x20ovunque.\x20Gli\x20schemi\x20taggati\x20vanno\x20da\x20soli\x20nel\x20profilo\x20della\x20squadra,\x20con\x20il\x20nome\x20scritto\x20nella\x20barra\x20sopra\x20il\x20pulsante.</p>\x0a<h3>Tagging\x20Under</h3>\x0a<p>Aperto\x20dalla\x20sezione\x20Under,\x20il\x20tagging\x20mostra\x20le\x20partite\x20del\x20gruppo.\x20Carica\x20partita\x20chiede\x20le\x20due\x20squadre,\x20la\x20giornata\x20e\x20il\x20video;\x20il\x20link\x20di\x20YouTube\x20o\x20Facebook\x20è\x20facoltativo,\x20e\x20se\x20c\x27è\x20basta\x20anche\x20solo\x20quello:\x20la\x20partita\x20si\x20apre\x20subito\x20e\x20il\x20video\x20si\x20aggiunge\x20dopo\x20dall\x27elenco\x20con\x20Aggiungi\x20video,\x20che\x20lo\x20carica\x20su\x20Drive\x20e\x20nella\x20playlist\x20YouTube\x20senza\x20perdere\x20i\x20tag.</p>\x0a<p>La\x20tavola\x20parte\x20dalla\x20Finestra\x20under\x20predefinita:\x20i\x2012\x20giocatori\x20del\x20gruppo\x20sono\x20già\x20in\x20campo,\x20senza\x20quintetto\x20e\x20senza\x20cambi,\x20e\x20il\x20pulsante\x20+\x20serve\x20a\x20metterne\x20uno\x20al\x20posto\x20di\x20un\x20altro.\x20Il\x20pulsante\x20Auto\x20parte\x20spento.\x20Gli\x20avversari\x20si\x20chiamano\x20Giocatore\x201,\x20Giocatore\x202\x20e\x20così\x20via:\x20con\x20Nomi\x20avversari\x20scrivi\x20i\x20nomi\x20veri,\x20e\x20quelli\x20cambiati\x20formano\x20il\x20roster\x20avversario\x20nelle\x20statistiche\x20di\x20fine\x20partita.\x20Nel\x20tagging\x20Under\x20le\x20finestre\x20nuove\x20e\x20le\x20tabelle\x20di\x20squadra\x20non\x20si\x20possono\x20salvare.</p>\x0a<h3>Finestre\x20salvate</h3>\x0a<p>Il\x20pulsante\x20Finestre\x20salva\x20la\x20disposizione\x20attuale\x20con\x20un\x20nome\x20e\x20la\x20ricarica\x20quando\x20serve,\x20anche\x20su\x20un\x27altra\x20partita.\x20Salvare\x20con\x20un\x20nome\x20già\x20usato\x20aggiorna\x20quella\x20finestra.\x20Le\x20finestre\x20si\x20possono\x20esportare\x20in\x20un\x20file\x20e\x20importare,\x20per\x20passarle\x20a\x20chi\x20non\x20le\x20vede.</p>\x0a<h3>Tabelloni:\x20punti,\x20tiri\x20e\x20possessi</h3>\x0a<p>In\x20alto\x20a\x20destra\x20sul\x20video\x20c\x27è\x20il\x20tabellone.\x20Il\x20primo\x20riquadro\x20somma\x20i\x20punti\x20di\x20ogni\x20squadra\x20a\x20ogni\x20tiro\x20da\x201,\x202\x20o\x203\x20(un\x20tiro\x20sbagliato\x20non\x20conta)\x20e\x20ha\x20il\x20meno\x20e\x20il\x20più\x20per\x20correggere.\x20Il\x20secondo\x20conta\x20i\x20tiri\x20tentati,\x20cioè\x201PT,\x202PT\x20e\x203PT\x20segnati\x20e\x20sbagliati,\x20e\x20i\x20possessi.</p>\x0a<p>Per\x20contare\x20un\x20possesso\x20premi\x20Maiusc\x20da\x20solo:\x20il\x20possesso\x20va\x20alla\x20squadra\x20della\x20tabella\x20aperta.\x20Se\x20premi\x20Maiusc\x20insieme\x20a\x20un\x20altro\x20tasto\x20non\x20conta.\x20Toccando\x20il\x20numero\x20dei\x20possessi\x20ne\x20togli\x20uno,\x20se\x20ti\x20sei\x20sbagliato.</p>\x0a<p>La\x20piccola\x20icona\x20sopra\x20il\x20tabellone\x20lo\x20nasconde\x20e\x20lo\x20rimostra,\x20e\x20la\x20maniglia\x20accanto\x20la\x20usi\x20per\x20spostarlo\x20dove\x20ti\x20è\x20più\x20comodo.\x20Ogni\x20volta\x20che\x20apri\x20il\x20tagging\x20il\x20tabellone\x20torna\x20in\x20alto\x20a\x20destra.</p>\x0a<h3>Il\x20tag\x20selezionato</h3>\x0a<p>Toccando\x20un\x20tag\x20nell\x27elenco\x20si\x20apre,\x20sotto\x20di\x20lui,\x20una\x20tendina\x20con\x20Rivedi,\x20Esporta\x20mp4,\x20la\x20nota\x20e\x20il\x20cestino,\x20e\x20una\x20barra\x20con\x20due\x20maniglie:\x20trascina\x20quella\x20di\x20sinistra\x20per\x20cambiare\x20l\x27inizio\x20e\x20quella\x20di\x20destra\x20per\x20cambiare\x20la\x20fine.\x20Sotto\x20il\x20tag\x20puoi\x20anche\x20cambiare\x20la\x20squadra\x20a\x20cui\x20è\x20riferito.\x20Il\x20cestino\x20elimina\x20subito\x20il\x20tag,\x20ma\x20lo\x20ritrovi\x20nel\x20pulsante\x20cestino\x20accanto\x20a\x20Finestre\x20e\x20Modifica\x20e\x20lo\x20ripristini\x20per\x2014\x20giorni.\x20Esporta\x20mp4\x20registra\x20la\x20clip\x20mentre\x20scorre\x20e\x20la\x20salva\x20sul\x20tuo\x20computer:\x20serve\x20il\x20video\x20aperto\x20da\x20file\x20e\x20un\x20browser\x20Chrome\x20o\x20Edge\x20recente,\x20altrimenti\x20il\x20file\x20è\x20webm.</p>\x0a<h3>Statistiche</h3>\x0a<p>L\x27icona\x20delle\x20statistiche\x20mostra\x20i\x20numeri\x20della\x20partita,\x20con\x20tre\x20viste:\x20Tutte,\x20Tagging\x20e\x20FIP\x20Stats.\x20Nel\x20Tagging\x20trovi\x20i\x20grafici\x20dei\x20tag,\x20le\x20tabelle\x20per\x20categoria\x20con\x20i\x20descrittori\x20e,\x20per\x20ogni\x20giocatore,\x20quante\x20volte\x20è\x20stato\x20taggato\x20in\x20ogni\x20categoria.\x20In\x20FIP\x20Stats,\x20se\x20la\x20partita\x20è\x20nei\x20dati,\x20trovi\x20parziali\x20e\x20tabellino\x20di\x20entrambe\x20le\x20squadre.</p>\x0a<p>In\x20alto\x20puoi\x20esportare\x20tutto:\x20Esporta\x20come\x20PDF\x20salva\x20la\x20schermata,\x20Scarica\x20Excel\x20crea\x20il\x20foglio\x20con\x20riepilogo,\x20tag\x20e\x20giocatori,\x20e\x20Carica\x20come\x20dati\x20vari\x20manda\x20il\x20foglio\x20nell\x27app,\x20nella\x20scheda\x20della\x20partita.\x20I\x20dati\x20si\x20leggono\x20così:\x20ogni\x20numero\x20è\x20un\x20conteggio\x20di\x20tag,\x20e\x20i\x20tag\x20con\x20esito\x20Ottimo,\x20Buono\x20e\x20Negativo\x20dicono\x20come\x20è\x20andata.\x20Per\x20le\x20statistiche\x20di\x20una\x20squadra\x20su\x20più\x20partite\x20(quanti\x20P&R\x20gioca,\x20in\x20che\x20modo\x20difende,\x20quanti\x20schemi\x20usa)\x20conta\x20la\x20somma\x20dei\x20tag\x20di\x20tutte\x20le\x20sue\x20partite.</p>\x0a<h3>Analisi\x20partita\x20e\x20liste\x20video</h3>\x0a<p>La\x20tappa\x20Analizza,\x20in\x20alto,\x20apre\x20una\x20schermata\x20a\x20due\x20parti.\x20A\x20sinistra,\x20in\x20una\x20colonna\x20stretta,\x20i\x20grafici:\x20tag\x20per\x20categoria,\x20quando\x20sono\x20avvenuti,\x20chi\x20ha\x20più\x20tag\x20e\x20i\x20descrittori\x20più\x20usati;\x20in\x20alto\x20scegli\x20Tutte,\x20Tagging\x20o\x20FIP\x20Stats.\x20A\x20destra,\x20in\x20grande,\x20il\x20video,\x20i\x20filtri\x20per\x20categoria,\x20giocatore\x20e\x20descrittore\x20e\x20l\x27elenco\x20dei\x20tag.</p>\x0a<p>Toccando\x20una\x20riga\x20la\x20clip\x20parte\x20nel\x20video,\x20e\x20con\x20Clip\x20precedente\x20e\x20Clip\x20successiva\x20scorri\x20quelle\x20filtrate.\x20Il\x20pulsante\x20+\x20a\x20sinistra\x20di\x20ogni\x20riga\x20la\x20aggiunge\x20alla\x20lista\x20in\x20costruzione\x20(diventa\x20un\x20segno\x20di\x20spunta,\x20premilo\x20ancora\x20per\x20toglierla).\x20Crea\x20lista\x20video\x20ti\x20chiede\x20se\x20è\x20per\x20la\x20squadra\x20o\x20per\x20un\x20giocatore:\x20dai\x20un\x20nome\x20e\x20salva.\x20Puoi\x20fare\x20tutte\x20le\x20liste\x20che\x20vuoi,\x20e\x20ognuna\x20si\x20può\x20riprodurre,\x20esportare\x20in\x20un\x20unico\x20video,\x20modificare\x20o\x20eliminare.\x20Esporta\x20CSV\x20scarica\x20l\x27elenco\x20dei\x20tag\x20filtrati.</p>\x0a<p>Nel\x20popup\x20di\x20una\x20lista\x20trascini\x20le\x20clip\x20con\x20i\x20puntini\x20per\x20cambiare\x20l\x27ordine.\x20Sotto\x20il\x20video\x20c\x27è\x20la\x20barra\x20del\x20tempo:\x20trascini\x20le\x20maniglie\x20gialle\x20per\x20allungare\x20o\x20accorciare\x20la\x20clip,\x20o\x20la\x20parte\x20colorata\x20per\x20spostarla.\x20La\x20gomma\x20di\x20ogni\x20clip\x20toglie\x20i\x20suoi\x20disegni,\x20l\x27icona\x20con\x20i\x20due\x20quadrati\x20la\x20copia\x20in\x20un\x27altra\x20lista.\x20Aggiungi\x20clip\x20da\x20un\x27altra\x20lista\x20unisce\x20anche\x20clip\x20di\x20altre\x20partite\x20(il\x20video\x20deve\x20essere\x20su\x20Drive).\x20Crea\x20video\x20registra\x20le\x20clip\x20in\x20un\x20file\x20unico\x20che\x20salvi\x20sul\x20computer\x20o\x20carichi\x20su\x20Drive,\x20e\x20l\x27app\x20chiede\x20cosa\x20caricare\x20(playbook\x20avversario,\x20video\x20partita,\x20post\x20partita,\x20dati\x20vari).\x20Presentazione\x20fa\x20scorrere\x20le\x20clip\x20con\x20le\x20frecce.</p>\x0a<h3>Tagga,\x20Analizza,\x20Presenta</h3>\x0a<p>In\x20alto\x20ci\x20sono\x20sempre\x20tre\x20tappe.\x20Tagga\x20è\x20la\x20schermata\x20di\x20lavoro\x20con\x20il\x20video\x20e\x20i\x20pulsanti.\x20Analizza\x20apre\x20la\x20matrice,\x20le\x20statistiche,\x20i\x20filtri\x20e\x20l\x27elenco\x20dei\x20tag.\x20Presenta\x20raccoglie\x20le\x20liste\x20video,\x20controlla\x20la\x20durata\x20e\x20porta\x20la\x20clip\x20alla\x20squadra\x20o\x20nell\x27esportazione.</p>\x0a<p>La\x20matrice\x20ha\x20le\x20categorie\x20nelle\x20righe\x20e\x20i\x20descrittori\x20nelle\x20colonne:\x20ogni\x20numero\x20dice\x20quante\x20clip\x20hanno\x20quella\x20combinazione.\x20Tocca\x20un\x20numero\x20per\x20vedere\x20subito\x20quelle\x20clip\x20(per\x20esempio\x20i\x20rimbalzi\x20difensivi\x20con\x20descrittore\x20Negativo),\x20il\x20nome\x20di\x20una\x20riga\x20per\x20tutte\x20le\x20clip\x20di\x20quella\x20categoria,\x20il\x20nome\x20di\x20una\x20colonna\x20per\x20tutte\x20quelle\x20con\x20quel\x20descrittore.\x20Con\x20Durata\x20al\x20posto\x20di\x20Numero\x20vedi\x20i\x20secondi\x20delle\x20clip,\x20non\x20i\x20conteggi.\x20La\x20matrice\x20segue\x20i\x20filtri\x20di\x20squadra\x20e\x20di\x20giocatore.\x20In\x20Statistiche,\x20Durata\x20delle\x20clip\x20somma\x20i\x20secondi\x20per\x20categoria\x20e\x20per\x20descrittore:\x20non\x20è\x20il\x20tempo\x20vero\x20di\x20gioco,\x20dipende\x20dai\x20secondi\x20prima\x20e\x20dopo\x20di\x20ogni\x20pulsante.</p>\x0a<p>Confronta\x20clip,\x20sopra\x20l\x27elenco\x20dei\x20tag,\x20fa\x20spuntare\x20da\x202\x20a\x204\x20clip\x20e\x20le\x20affianca\x20nello\x20stesso\x20schermo:\x20partono\x20insieme\x20e\x20puoi\x20fermarle,\x20rallentarle\x20e\x20farle\x20ripetere.\x20Serve\x20il\x20video\x20aperto\x20da\x20file\x20o\x20da\x20Drive.</p>\x0a<p>In\x20una\x20lista\x20ogni\x20clip\x20ha\x20la\x20spunta\x20Nel\x20video\x20e\x20la\x20velocità.\x20Spenta,\x20la\x20clip\x20resta\x20in\x20lista\x20ma\x20non\x20va\x20in\x20presentazione\x20né\x20nel\x20video\x20esportato,\x20così\x20accorci\x20senza\x20perdere\x20nulla.\x20Con\x20la\x20velocità\x200,5x\x20quella\x20clip\x20passa\x20al\x20rallentatore.\x20In\x20alto\x20si\x20vede\x20la\x20durata\x20totale,\x20che\x20diventa\x20rossa\x20sopra\x20gli\x208\x20minuti,\x20il\x20tempo\x20consigliato\x20per\x20una\x20riunione.\x20Consiglio:\x20una\x20lista\x20chiamata\x20Video\x20finale\x20con\x20solo\x20le\x20clip\x20da\x20mostrare.</p>\x0a<p>Presenta,\x20accanto\x20a\x20ogni\x20lista,\x20apre\x20la\x20presentazione\x20a\x20schermo\x20intero.\x20Solo\x20video\x20(tasto\x20S)\x20nasconde\x20tutto\x20tranne\x20il\x20video,\x20adatto\x20alla\x20squadra.\x20Copione\x20a\x20parte\x20apre\x20una\x20seconda\x20finestra\x20con\x20l\x27elenco\x20delle\x20clip,\x20le\x20note\x20e\x20i\x20pulsanti\x20per\x20scorrere,\x20fermare\x20e\x20cambiare\x20velocità:\x20porta\x20la\x20prima\x20finestra\x20sul\x20proiettore\x20e\x20tieni\x20il\x20copione\x20sul\x20tuo\x20schermo.\x20In\x20Presenta\x20scegli\x20anche\x20il\x20logo\x20della\x20società\x20sul\x20video,\x20un\x20file\x20per\x20ogni\x20clip\x20(utile\x20per\x20mandare\x20le\x20clip\x20ai\x20singoli\x20giocatori)\x20e\x20il\x20file\x20dei\x20capitoli,\x20un\x20testo\x20con\x20il\x20minuto\x20di\x20inizio\x20di\x20ogni\x20clip.</p>\x0a<p>Clip\x20rapida\x20(pulsante\x20sotto\x20il\x20video,\x20oppure\x20premi\x20e\x20rilascia\x20il\x20tasto\x20Ctrl)\x20crea\x20al\x20volo\x20una\x20clip\x20con\x20una\x20nota,\x20anche\x20se\x20non\x20hai\x20un\x20pulsante\x20per\x20quell\x27azione.\x20La\x20velocità\x20del\x20video\x20scelta\x20con\x20il\x20menu\x20resta\x20uguale\x20anche\x20dopo\x20una\x20pausa\x20o\x20un\x20cambio\x20di\x20clip,\x20e\x20le\x20misure\x20delle\x20finestre\x20si\x20ricordano\x20per\x20ogni\x20utente.</p>\x0a<p>Nelle\x20statistiche,\x20il\x20riquadro\x20Numeri\x20per\x20possesso\x20mostra\x20punti\x20per\x20possesso,\x20tiro\x20effettivo,\x20palle\x20perse\x20ogni\x20100\x20possessi\x20e\x20altro\x20per\x20le\x20due\x20squadre.\x20I\x20possessi\x20si\x20possono\x20prendere\x20dal\x20tabellone\x20(quelli\x20che\x20conti\x20con\x20Tab\x20o\x20Maiusc)\x20oppure\x20dalla\x20formula\x20tiri\x20+\x200,45\x20liberi\x20+\x20palle\x20perse\x20-\x20rimbalzi\x20offensivi:\x20i\x20due\x20conteggi\x20possono\x20differire\x20e\x20c\x27è\x20l\x27interruttore\x20per\x20scegliere.\x20Nell\x27editor\x20della\x20lista,\x20Slide\x20con\x20numeri\x20inserisce\x20dopo\x20la\x20clip\x20una\x20diapositiva\x20con\x202\x20o\x203\x20di\x20questi\x20numeri,\x20che\x20si\x20vede\x20anche\x20nel\x20video\x20esportato.</p>\x0a<h3>Lavorare\x20in\x20più\x20persone</h3>\x0a<p>Le\x20partite,\x20i\x20tag,\x20le\x20liste\x20video\x20e\x20le\x20finestre\x20salvate\x20sono\x20comuni\x20a\x20tutto\x20lo\x20staff.\x20Nell\x27elenco\x20delle\x20partite\x20vedi\x20chi\x20ci\x20ha\x20lavorato\x20e\x20chi\x20è\x20stato\x20l\x27ultimo,\x20con\x20giorno\x20e\x20ora.\x20Un\x20pallino\x20verde\x20mostra\x20chi\x20sta\x20lavorando\x20in\x20quel\x20momento\x20sulla\x20stessa\x20partita.</p>\x0a<h3>Salvataggio\x20automatico</h3>\x0a<p>Ogni\x20tag\x20si\x20salva\x20da\x20solo\x20subito\x20dopo\x20averlo\x20fatto.\x20Se\x20chiudi\x20l\x27app\x20a\x20metà,\x20alla\x20riapertura\x20trovi\x20l\x27ultima\x20partita\x20dal\x20minuto\x20in\x20cui\x20eri\x20e\x20i\x20tag\x20non\x20ancora\x20salvati\x20vengono\x20recuperati.\x20Premendo\x20Partite\x20si\x20torna\x20all\x27elenco.</p>\x0a<h3>Scorciatoie</h3>\x0a<p>Pulsante\x20x2\x20sotto\x20il\x20video:\x20raddoppia\x20la\x20velocità,\x20premuto\x20di\x20nuovo\x20torna\x20normale.\x20Tasto\x20x2\x20(di\x20partenza\x20è\x20L):\x20finché\x20lo\x20tieni\x20premuto\x20il\x20video\x20va\x20al\x20doppio,\x20quando\x20lo\x20lasci\x20torna\x20com\x27era.\x20Per\x20scegliere\x20un\x20altro\x20tasto\x20tocca\x20il\x20pulsante\x20Tasto\x20x2\x20e\x20premi\x20quello\x20che\x20vuoi;\x20Backspace\x20lo\x20disattiva.\x20Il\x20tasto\x20scelto\x20vale\x20al\x20posto\x20di\x20un\x20eventuale\x20pulsante\x20che\x20aveva\x20la\x20stessa\x20lettera.\x20Barra\x20spaziatrice:\x20play\x20e\x20pausa.\x20Frecce\x20sinistra\x20e\x20destra:\x205\x20secondi\x20indietro\x20o\x20avanti.\x20Frecce\x20su\x20e\x20giù:\x2010\x20secondi\x20avanti\x20o\x20indietro.\x20Il\x20pulsante\x20Frecce,\x20sotto\x20il\x20video,\x20cambia\x20questi\x20secondi.\x20Il\x20tasto\x20assegnato\x20a\x20una\x20categoria\x20crea\x20il\x20tag.\x20Maiusc\x20da\x20solo\x20aggiunge\x20un\x20possesso.\x20Tab\x20cambia\x20tabella.</p>\x0a<p\x20style=\x22margin-top:14px;opacity:.7\x22><a\x20href=\x22https://tagup.it/\x22\x20target=\x22_blank\x22\x20rel=\x22noopener\x22\x20style=\x22color:inherit;font-weight:800\x22>Tagup&reg;</a>\x20tagup.it\x20&middot;\x202026</p></div></div>',_0x42419a('hX')['onclick']=function(){var _0x205f09=_0x5eaf3a;_0x38f215[_0x205f09(0xb8e)][_0x205f09(0x54a)]('hid');};};var _0x10d17a='C';try{var _0x36ef73=localStorage['getItem'](_0x5a23e9(_0x4cc8c7(0x205)));'B'!==_0x36ef73&&'C'!==_0x36ef73&&''!==_0x36ef73||(_0x10d17a=null===_0x36ef73?'C':_0x36ef73);}catch(_0x3fe655){}var _0x4268c0=null,_0x305bff=null,_0x183d0c=null,_0x44ab4f='Grypho\x20Perugia',_0x1b60d2='',_0x4cbc10=_0x4cc8c7(0x998),_0x3d29c5={'rett':_0x4cc8c7(0x9c5),'ovale':_0x4cc8c7(0xaa2),'cerchio':_0x4cc8c7(0x8e6)},_0x5f238c={'rett
